# explicit project name: the default one is the name of the directory, "tests"
name: channels-tests
services:
    jahia:
        image: '${JAHIA_IMAGE}'
        container_name: channels-jahia
        ports:
            # published on this machine only
            - '127.0.0.1:${JAHIA_PORT:-8090}:8080'
            - '127.0.0.1:${JAHIA_DEBUG_PORT:-8010}:8000'
        environment:
            - SUPER_USER_PASSWORD=${SUPER_USER_PASSWORD}
            - JAHIA_LICENSE=${JAHIA_LICENSE}
            - JPDA=${JAHIA_JPDA:-false}
        networks:
            - stack
networks:
    stack:
