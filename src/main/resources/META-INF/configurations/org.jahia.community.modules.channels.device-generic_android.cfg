# Default configuration: it can be changed, see README.md
# Device resolved from the User-Agent header.
# Generated by tools/generate-devices.py. See README.md for the supported keys.
identifier = generic_android
fallBack = generic_mobile
capability.display-name = Phone: Android
capability.template-type-mapping = android
capability.userAgentPattern = .*Android.*Mobile.*
capability.variants = portrait,landscape
capability.variants-displayNames = Portrait,Landscape
capability.usable-resolutions = 360x800,800x360
capability.decorator-images = /modules/channels/images/frames/generic_android-portrait.svg,/modules/channels/images/frames/generic_android-landscape.svg
capability.decorator-image-sizes = 388x880,880x388
capability.decorator-screen-positions = 14x40,40x14
capability.overlay-scrollbars = true
