# Default configuration: it can be changed, see README.md
# Device resolved from the User-Agent header.
# Generated by tools/generate-devices.py. See README.md for the supported keys.
identifier = android_tablet
fallBack = generic
capability.display-name = Tablet: Android
capability.template-type-mapping = tablet
capability.userAgentPattern = .*Android(?!.*Mobile).*
capability.variants = portrait,landscape
capability.variants-displayNames = Portrait,Landscape
capability.usable-resolutions = 768x1024,1024x768
capability.decorator-images = /modules/channels/images/frames/android_tablet-portrait.svg,/modules/channels/images/frames/android_tablet-landscape.svg
capability.decorator-image-sizes = 820x1084,1084x820
capability.decorator-screen-positions = 26x30,30x26
capability.overlay-scrollbars = true
